name: Deploy Workflow

on:
    push:
        branches:
            - main

permissions:
    id-token: write
    contents: read
    security-events: write

env:
    AWS_REGION: ${{ vars.AWS_REGION }}
    STATE_BUCKET: ${{ vars.STATE_BUCKET }}
    ENV_NAME: ${{ vars.ENV_NAME }}

jobs:
    terraform:
        name: Terraform Apply
        runs-on: ubuntu-latest
        strategy:
            max-parallel: 1
            matrix:
                module: [networking, storage, compute, monitoring, security]

        defaults:
            run:
                working-directory: ${{ github.workspace }}/v2/env/dev/${{ matrix.module }}

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v3

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                aws-region: ${{ env.AWS_REGION }}

            - name: Terraform setup
              uses: hashicorp/setup-terraform@v3

            - name: Terraform Init
              run: |
                STATE_KEY="v2/env/dev/${{ matrix.module }}/terraform.tfstate"
                terraform init \
                  -backend-config="bucket=${{ env.STATE_BUCKET }}" \
                  -backend-config="key=$STATE_KEY" \
                  -backend-config="region=${{ env.AWS_REGION }}" \
                  -backend-config="use_lockfile=true"
                
            - name: Terraform Validate
              run: terraform validate

            - name: Terraform Plan
              run: terraform plan -out=tfplan -var-file=${{ github.workspace }}/v2/global/variables.tfvars

            - name: Terraform Apply
              run: terraform apply -auto-approve tfplan

            - name: Login to Amazon ECR
              if: matrix.module == 'compute'
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build, Tag, and Push Docker Image
              if: matrix.module == 'compute'
              env:
                ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                ECR_REPOSITORY: dev-portal-backend
                IMAGE_TAG: v4
              run: |
                echo "Navigating to application directory..."
                cd ${{ github.workspace }}/v2/app/portal-backend
                
                echo "Building Docker image..."
                docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
                
                echo "Pushing image to ECR..."
                docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            - name: Kickstart Fargate Service
              if: matrix.module == 'compute'
              run: |
                echo "Fetching dynamic cluster and service names from Terraform..."
                CLUSTER_NAME=$(terraform output -raw ecs_cluster_name)
                SERVICE_NAME=$(terraform output -raw ecs_service_name)
                
                echo "Targeting Cluster: $CLUSTER_NAME"
                echo "Targeting Service: $SERVICE_NAME"
                
                echo "Forcing ECS to pull the fresh image..."
                aws ecs update-service \
                  --cluster $CLUSTER_NAME \
                  --service $SERVICE_NAME \
                  --force-new-deployment


            - name: Initialize Database Schema (ECS Standalone Task)
              if: matrix.module == 'compute'
              run: |
                # Grabbing your private subnets and ECS security group from Terraform outputs
                SUBNETS=$(terraform output -json eks-portal-subnets | jq -r 'join(",")')
                SG_ID=$(terraform output -raw ecs_portal_sg_id)
                
                echo "Triggering Fargate Task..."
                aws ecs run-task \
                  --cluster dev-fargate-cluster \
                  --task-definition dev-db-init-task \
                  --launch-type FARGATE \
                  --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG_ID],assignPublicIp=DISABLED}"
                
                echo "Database initialization task dispatched!"
              working-directory: ${{ github.workspace }}/v2/env/dev/compute

            - name: Bootstrap Cognito Test Users
              if: matrix.module == 'compute'
              env:
                ADMIN_PASS: ${{ secrets.ADMIN_PASSWORD }}
                EMP_PASS: ${{ secrets.EMP_PASSWORD }}
              run: |
                USER_POOL_ID=$(terraform output -raw cognito_user_pool_id)
                
                echo "🚀 Bootstrapping users into Cognito pool: $USER_POOL_ID"
                
                # --- 1. Admin User ---
                # Note: Adding || true prevents the pipeline from crashing if the user already exists on subsequent runs
                aws cognito-idp admin-create-user \
                  --user-pool-id $USER_POOL_ID \
                  --username admin@test.local \
                  --user-attributes Name=email,Value=admin@test.local Name=email_verified,Value=true \
                  --message-action SUPPRESS \
                  --output text > /dev/null || true
                  
                aws cognito-idp admin-set-user-password \
                  --user-pool-id $USER_POOL_ID \
                  --username admin@test.local \
                  --password "$ADMIN_PASS" \
                  --permanent
                  
                aws cognito-idp admin-add-user-to-group \
                  --user-pool-id $USER_POOL_ID \
                  --username admin@test.local \
                  --group-name HR-Admins || true

                # --- 2. Standard Employee User ---
                aws cognito-idp admin-create-user \
                  --user-pool-id $USER_POOL_ID \
                  --username employee@test.local \
                  --user-attributes Name=email,Value=employee@test.local Name=email_verified,Value=true \
                  --message-action SUPPRESS \
                  --output text > /dev/null || true
                  
                aws cognito-idp admin-set-user-password \
                  --user-pool-id $USER_POOL_ID \
                  --username employee@test.local \
                  --password "$EMP_PASS" \
                  --permanent
                  
                aws cognito-idp admin-add-user-to-group \
                  --user-pool-id $USER_POOL_ID \
                  --username employee@test.local \
                  --group-name Employee || true

                echo "✅ Users successfully provisioned!"
              working-directory: ${{ github.workspace }}/v2/env/dev/compute